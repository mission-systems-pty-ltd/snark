---
# sample ansible-playbook script to install snark dependencies and build snark from source; include it as it is or copy to your playbook

# todo: install more dependencies and turn on corresponding cmake switches snark_build_... ON

- hosts: localhost
  connection: local
  vars:
    make_j: 4
    base: "{{ ansible_env.HOME }}"
    snark_cmake_options: "-DBUILD_TESTS=ON -DINSTALL_TESTS=ON -DINSTALL_BASH_COMPLETION=ON -Dsnark_build_control=ON -Dsnark_build_graph=ON -Dsnark_build_graphics=ON -Dsnark_build_math_fft=ON -Dsnark_build_geometry=ON -Dsnark_build_point_cloud=ON Dsnark_build_python=ON -Dsnark_build_sensors_dc1394=ON -Dsnark_build_sensors_velodyne=ON -Dsnark_build_sensors_vimba=OFF -Dsnark_build_web=ON -Dsnark_build_web_feeds=ON -Dsnark_build_imaging=ON -Dsnark_build_imaging_stereo=OFF"
    src_dir: "{{ base }}/src/snark"
    build_in_src: false
    build_dir: "{{ src_dir + '/build' if build_in_src else base + '/build/snark' }}"
    comma_src_dir: "{{ src_dir }}/../comma"

  tasks:
  - name: "snark: dependencies: installing"
    become: true
    apt: pkg={{ item }} state=present update_cache=yes
    with_items:
      - libeigen3-dev
      - libfftw3-dev
      - libtbb-dev
      - zlib1g-dev
      - libbz2-dev
      - libexiv2-dev
      - libopencv-dev
      - libopencv-highgui-dev
      - libpcap-dev
      - qtbase5-dev
      - qtchooser
      - qt5-qmake
      - qtbase5-dev-tools
      - qt3d5-dev
      - libassimp-dev
      - python3-pip
      - python3-opencv
      - python3-pysolar
      - libqt5charts5-dev

  # - pip:
  #       name: "pysolar"
  #       executable: pip3
  #   become: true

  - name: "snark: make directory {{ base }}/src"
    file: path={{ base }}/src state=directory

  - name: "snark: dependencies: clone comma"
    git:
        repo: "https://gitlab.com/orthographic/comma.git"
        dest: "{{ comma_src_dir }}"
        clone: yes
        update: yes

  - name: "snark: dependencies: install comma"
    script: /usr/bin/ansible-playbook {{ comma_src_dir }}/system/ansible/install.yml -e "src_dir={{ comma_src_dir }} build_in_src={{ build_in_src }}"

  - name: "snark: clone"
    git:
        repo: "https://gitlab.com/orthographic/snark.git"
        dest: "{{ src_dir }}"
        clone: yes
        update: yes

  - name: "snark: make build directory at {{ base }}"
    file: dest="{{ build_dir }}" state=directory

  - name: "snark: cmake"
    shell: "/usr/bin/cmake {{ snark_cmake_options }} {{ src_dir }} chdir={{ build_dir }}"

  - name: "snark: make"
    make:
        chdir: "{{ build_dir }}"
        params:
            MAKEFLAGS: "-j {{ make_j }}"

  - name: "snark: install"
    become: true
    make:
        chdir: "{{ build_dir }}"
        target: "install"

